name: Release

# Push a tag such as v0.5.0 to build the Windows executable and publish a
# GitHub release with it attached.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: Build
        working-directory: rust
        run: cargo build --release
      - name: Package
        shell: pwsh
        run: |
          $name = "OpenASE-${{ github.ref_name }}-windows-x64"
          New-Item -ItemType Directory $name | Out-Null
          Copy-Item rust/target/release/openase.exe "$name/OpenASE.exe"
          Copy-Item LICENSE, README.md $name
          Compress-Archive -Path $name -DestinationPath "$name.zip"
      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" "OpenASE-${{ github.ref_name }}-windows-x64.zip" --title "OpenASE ${{ github.ref_name }}" --generate-notes
