name: Release

# Push a tag such as v0.7.0 to build OpenASE for Windows, Linux and macOS and
# publish a GitHub release with the three packages attached. Run it by hand
# with a tag name to (re)build the packages of an existing release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build, e.g. v0.6.0"
        required: true
      publish:
        description: "Publish the packages to the GitHub release (untick to only test the builds)"
        type: boolean
        default: true

permissions:
  contents: write

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: Build
        working-directory: rust
        run: cargo build --release
      - name: Package
        shell: pwsh
        run: |
          $name = "OpenASE-$env:TAG-windows-x64"
          New-Item -ItemType Directory $name | Out-Null
          Copy-Item rust/target/release/openase.exe "$name/OpenASE.exe"
          Copy-Item LICENSE, README.md $name
          Compress-Archive -Path $name -DestinationPath "$name.zip"
      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: OpenASE-*.zip

  linux:
    # The oldest supported Ubuntu keeps the glibc requirement low, so the
    # binary also runs on older distributions.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - name: Install GUI libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libgtk-3-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: Build
        working-directory: rust
        run: cargo build --release
      - name: Package
        run: |
          name="OpenASE-$TAG-linux-x64"
          mkdir "$name"
          cp rust/target/release/openase "$name/openase"
          cp rust/assets/icon.png "$name/openase.png"
          cp LICENSE README.md "$name/"
          cat > "$name/openase.desktop" <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=OpenASE
          Comment=Game server browser in the spirit of The All-Seeing Eye
          Exec=openase
          Icon=openase
          Categories=Game;Network;
          EOF
          sed -i 's/^ *//' "$name/openase.desktop"
          tar czf "$name.tar.gz" "$name"
      - name: Package AppImage
        env:
          APPIMAGETOOL_URL: https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage
          APPIMAGETOOL_SHA256: ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0
          APPIMAGE_EXTRACT_AND_RUN: "1"
          ARCH: x86_64
        run: |
          appdir=OpenASE.AppDir
          mkdir -p "$appdir/usr/bin"
          cp rust/target/release/openase "$appdir/usr/bin/openase"
          cp rust/assets/icon.png "$appdir/openase.png"
          cp rust/assets/icon.png "$appdir/.DirIcon"
          cat > "$appdir/openase.desktop" <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=OpenASE
          Comment=Game server browser in the spirit of The All-Seeing Eye
          Exec=openase
          Icon=openase
          Categories=Game;Network;
          EOF
          sed -i 's/^ *//' "$appdir/openase.desktop"
          ln -s usr/bin/openase "$appdir/AppRun"
          curl -fsSL -o appimagetool.AppImage "$APPIMAGETOOL_URL"
          echo "$APPIMAGETOOL_SHA256  appimagetool.AppImage" | sha256sum -c -
          chmod +x appimagetool.AppImage
          ./appimagetool.AppImage "$appdir" "OpenASE-$TAG-linux-x86_64.AppImage"
      - uses: actions/upload-artifact@v7
        with:
          name: linux
          path: |
            OpenASE-*.tar.gz
            OpenASE-*.AppImage

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: Build (Apple Silicon and Intel)
        working-directory: rust
        run: |
          cargo build --release --target aarch64-apple-darwin
          cargo build --release --target x86_64-apple-darwin
      - name: Package universal app
        run: |
          version="${TAG#v}"
          app="OpenASE.app"
          mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources"
          lipo -create -output "$app/Contents/MacOS/OpenASE" \
            rust/target/aarch64-apple-darwin/release/openase \
            rust/target/x86_64-apple-darwin/release/openase
          iconset=OpenASE.iconset
          mkdir "$iconset"
          for size in 16 32 128 256 512; do
            sips -z $size $size rust/assets/icon.png --out "$iconset/icon_${size}x${size}.png" >/dev/null
            double=$((size * 2))
            sips -z $double $double rust/assets/icon.png --out "$iconset/icon_${size}x${size}@2x.png" >/dev/null
          done
          iconutil -c icns "$iconset" -o "$app/Contents/Resources/OpenASE.icns"
          cat > "$app/Contents/Info.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key><string>OpenASE</string>
            <key>CFBundleDisplayName</key><string>OpenASE</string>
            <key>CFBundleIdentifier</key><string>io.github.tsautier.openase</string>
            <key>CFBundleExecutable</key><string>OpenASE</string>
            <key>CFBundleIconFile</key><string>OpenASE</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>${version}</string>
            <key>CFBundleVersion</key><string>${version}</string>
            <key>LSMinimumSystemVersion</key><string>11.0</string>
            <key>NSHighResolutionCapable</key><true/>
          </dict>
          </plist>
          EOF
          # Ad-hoc signature: required to run on Apple Silicon.
          codesign --force --deep --sign - "$app"
          name="OpenASE-$TAG-macos-universal"
          mkdir "$name"
          mv "$app" "$name/"
          cp LICENSE README.md "$name/"
          ditto -c -k --keepParent "$name" "$name.zip"
      - uses: actions/upload-artifact@v7
        with:
          name: macos
          path: OpenASE-*.zip

  publish:
    needs: [windows, linux, macos]
    if: ${{ inputs.publish != false }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          ls -l dist
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --title "OpenASE $TAG" --generate-notes
          fi
