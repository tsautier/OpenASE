name: Bug report
description: Something does not work as expected
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. The more detail you give, the easier it is to fix.
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows
        - Linux
        - macOS
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: OpenASE version
      description: For example 0.6.0. Shown in Help > About OpenASE, or in the release file name.
    validations:
      required: true
  - type: input
    id: game
    attributes:
      label: Game
      description: Which game is affected, if any.
      placeholder: Urban Terror
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open OpenASE
        2. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Paste any error text or output here. Output of `cargo run --example query -- <id> host:port` is very helpful for query problems.
      render: shell
