[package]
name = "openase"
version = "0.9.6"
authors = ["Thomas Sautier"]
edition = "2024"
rust-version = "1.88"
description = "Open-source game server browser inspired by The All-Seeing Eye"
license = "GPL-3.0-or-later"
repository = "https://github.com/tsautier/OpenASE"

[dependencies]
eframe = { version = "0.37.0", features = ["persistence"] }
egui_extras = "0.37.0"
flate2 = "1.1.11"
regex = "1.13.1"
rfd = "0.17.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
ureq = { version = "3.5.1", features = ["json"] }

[target."cfg(windows)".dependencies]
winreg = "0.56.0"

[dev-dependencies]
tempfile = "3.27.0"

[build-dependencies]
winresource = "0.1.34"

[profile.release]
strip = true
lto = "fat"
codegen-units = 1
